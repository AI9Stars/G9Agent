services:
  g9agent:
    build: .
    image: g9agent:latest
    ports:
      - "3001:3001"
    volumes:
      # Persist all G9Agent state: generated config, auth DB, permissions,
      # sessions/projects, memory, skills/plugins, and router stats.
      - g9agent-home:/root/.g9agent
      # Optional: mount an existing config file instead of generating one from env vars.
      # Create the host file first, then uncomment this line.
      # - ${G9AGENT_CONFIG:-${HOME}/.g9agent/g9agent.yaml}:/root/.g9agent/g9agent.yaml:ro
      # Optional: expose a host workspace to agents running inside the container.
      # - ${G9AGENT_WORKSPACE:-${PWD}}:/workspace
    environment:
      - NODE_ENV=production
      - G9AGENT_HOME=/root/.g9agent
      - SERVER_PORT=3001
      - G9AGENT_GATEWAY_PORT=18789
      # Require login for REST and WebSocket access, including the terminal.
      - G9AGENT_DISABLE_LOCAL_AUTH=0
      #
      # ── Proxy (uncomment if behind corporate proxy) ──
      # - https_proxy=http://host.docker.internal:7890
      # - G9AGENT_PROXY=http://host.docker.internal:7890
      #
      # ── Or configure via env vars instead of mounting yaml ──
      # - G9AGENT_MODEL=openai/gpt-4.1
      # - G9AGENT_API_KEY=sk-xxx
      # - G9AGENT_API_URL=https://api.openai.com/v1
    restart: unless-stopped

volumes:
  g9agent-home:
